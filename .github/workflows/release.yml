name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.event.head_commit.message, '[version] v') }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get Version
        id: get-version
        run: echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            ./dist/ArcaRefresher.meta.js
            ./dist/ArcaRefresher.user.js
            ./dist/ArcaRefresher.user.js.LICENSE.txt
